name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: lap-website/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('lap-website/package-lock.json') }}-${{ hashFiles('lap-website/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('lap-website/package-lock.json') }}-
            nextjs-${{ runner.os }}-
      - run: npm ci
      - run: npm run ci
      - run: npm run lint:feature-case && npm run lint:i18n-ready && npm run lint:page-template && npm run lint:faq && npm run lint:spelling
