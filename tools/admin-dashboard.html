<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAP Admin Dashboard</title>
<!--
  LOCAL ADMIN TOOL — runs on your machine only.
  All data displayed comes from authenticated admin API endpoints.
  innerHTML usage is safe: all values come from the admin API (trusted source),
  not from user-generated content. No untrusted input enters the DOM.
-->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root { --bg: #0a0a0a; --card: #141414; --border: rgba(255,255,255,0.1); --text: #F0EDE5; --muted: #949494; --green: #22c55e; --gold: #C9A84C; --red: #FF2A2A; --purple: #8B5CF6; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; width: 360px; }
  .login-box h1 { font-size: 20px; margin-bottom: 4px; }
  .login-box p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .login-box input { width: 100%; padding: 10px 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; margin-bottom: 12px; outline: none; }
  .login-box input:focus { border-color: var(--green); }
  .login-box button { width: 100%; padding: 10px; background: var(--gold); color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .login-box button:hover { opacity: 0.85; }
  .login-box .error { color: var(--red); font-size: 12px; margin-bottom: 8px; }
  .dashboard { display: none; max-width: 1100px; margin: 0 auto; padding: 24px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .header h1 { font-size: 24px; font-weight: 700; }
  .header button { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .header button:hover { color: var(--text); border-color: var(--text); }
  .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .tab { padding: 6px 16px; font-size: 13px; color: var(--muted); cursor: pointer; border-radius: 6px 6px 0 0; border: 1px solid transparent; }
  .tab.active { color: var(--green); border-color: var(--border); border-bottom-color: var(--bg); background: var(--card); }
  .tab:hover:not(.active) { color: var(--text); }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .metric { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .metric .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .metric .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 16px; }
  .chart-container { position: relative; height: 220px; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .bar-label { width: 120px; font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
  .bar-track { flex: 1; height: 24px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--gold); border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 11px; color: #fff; font-weight: 600; min-width: 30px; }
  .bar-users { width: 60px; font-size: 11px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; padding: 8px; color: var(--muted); font-weight: 400; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--border); }
  td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; border: 1px solid; white-space: nowrap; }
  .badge-session { background: rgba(201,168,76,0.15); color: var(--gold); border-color: rgba(201,168,76,0.3); }
  .badge-compare { background: rgba(139,92,246,0.15); color: var(--purple); border-color: rgba(139,92,246,0.3); }
  .badge-report { background: rgba(34,197,94,0.15); color: var(--green); border-color: rgba(34,197,94,0.3); }
  .badge-page { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); border-color: rgba(255,255,255,0.1); }
  .badge-limit { background: rgba(255,42,42,0.15); color: var(--red); border-color: rgba(255,42,42,0.3); }
  .retention-cell { text-align: center; padding: 6px; border-radius: 4px; color: #fff; font-size: 12px; }
  .progress-wrap { margin-bottom: 16px; }
  .progress-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .progress-sub { font-size: 10px; color: var(--muted); margin-top: 4px; }
  .user-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: rgba(201,168,76,0.2); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: var(--gold); }
  .user-name { font-size: 18px; font-weight: 700; }
  .user-email { font-size: 13px; color: var(--muted); }
  .plan-badge { font-size: 11px; padding: 3px 10px; border-radius: 4px; background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .mini-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .mini-metric .label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .mini-metric .value { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .feature-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; }
  .feature-row .name { color: rgba(255,255,255,0.6); }
  .feature-row .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .back-link { font-size: 12px; color: var(--muted); cursor: pointer; margin-bottom: 16px; display: inline-block; }
  .back-link:hover { color: var(--text); }
  .user-row { cursor: pointer; }
  .user-row:hover { background: rgba(255,255,255,0.02); }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .page { display: none; }
  .page.active { display: block; }
  @media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } .metrics { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>LAP Admin</h1>
    <p>Local dashboard — data fetched from production API</p>
    <div class="error" id="loginError" style="display:none"></div>
    <input type="email" id="emailInput" placeholder="Email" autocomplete="email">
    <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Sign In</button>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="header">
    <h1>LAP Admin</h1>
    <div style="display:flex;align-items:center;gap:16px">
      <span style="font-size:13px;color:var(--muted)" id="userInfo"></span>
      <button onclick="doLogout()">Sign Out</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-page="analytics" onclick="showPage('analytics')">Analytics</div>
    <div class="tab" data-page="users" onclick="showPage('users')">Users</div>
  </div>
  <div class="page active" id="page-analytics">
    <div class="metrics" id="summaryMetrics"></div>
    <div class="card"><h2>Daily Active Users</h2><div class="chart-container"><canvas id="dauChart"></canvas></div></div>
    <div class="card"><h2>Feature Adoption (30d)</h2><div id="featureBars"></div></div>
    <div class="card"><h2>Retention Cohorts</h2><div id="retentionTable"></div></div>
    <div class="card"><h2>Event Timeline</h2><div id="timelineList" style="max-height:400px;overflow-y:auto"></div></div>
  </div>
  <div class="page" id="page-users">
    <div style="margin-bottom:16px"><input type="text" id="userSearch" placeholder="Search by email..." style="padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#F0EDE5;font-size:14px;width:300px;outline:none" oninput="searchUsers()"></div>
    <div class="card"><table id="usersTable"><thead><tr><th>User</th><th>Plan</th><th>Status</th><th>Joined</th></tr></thead><tbody></tbody></table></div>
  </div>
  <div class="page" id="page-user-detail"></div>
</div>

<script>
// NOTE: All DOM content rendered via helper functions below comes exclusively
// from authenticated admin API responses (trusted server data). No user-generated
// or untrusted content enters the DOM. This is a local-only admin tool.

const API = 'https://api.lap-coach.racing';
let token = null;
let dauChartInstance = null;
let allUsers = [];

async function doLogin() {
  const email = document.getElementById('emailInput').value;
  const password = document.getElementById('passwordInput').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
      credentials: 'include',
    });
    const data = await res.json();
    if (!res.ok || !data.data || !data.data.access_token) {
      errEl.textContent = (data.error && data.error.message) || 'Login failed';
      errEl.style.display = 'block';
      return;
    }
    token = data.data.access_token;
    document.getElementById('userInfo').textContent = data.data.user.email;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadAnalytics();
  } catch (e) {
    errEl.textContent = 'Connection failed';
    errEl.style.display = 'block';
  }
}

function doLogout() {
  token = null;
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
}

async function apiFetch(path) {
  const res = await fetch(API + '/api/v1' + path, {
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    credentials: 'include',
  });
  if (res.status === 401) { doLogout(); return null; }
  const envelope = await res.json();
  return envelope.ok ? envelope.data : null;
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  document.querySelector('.tab[data-page="' + name + '"]').classList.add('active');
  if (name === 'users' && allUsers.length === 0) loadUsers();
}

// ── Helpers ──
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function formatBytes(b) { if (b >= 1e9) return (b/1e9).toFixed(1)+' GB'; if (b >= 1e6) return (b/1e6).toFixed(1)+' MB'; return (b/1e3).toFixed(0)+' KB'; }
function humanize(s) { return s.split('.').map(function(w){ return w.charAt(0).toUpperCase()+w.slice(1); }).join(' '); }
function badgeClass(t) { if(t.startsWith('session.'))return 'badge-session'; if(t.startsWith('chart.')||t.startsWith('compare.'))return 'badge-compare'; if(t.startsWith('report.'))return 'badge-report'; if(t.startsWith('limit.'))return 'badge-limit'; return 'badge-page'; }
function timeAgo(iso) { var m=Math.floor((Date.now()-new Date(iso).getTime())/60000); if(m<60)return m+'m ago'; var h=Math.floor(m/60); if(h<24)return h+'h ago'; return Math.floor(h/24)+'d ago'; }

function metricHTML(label, value) {
  return '<div class="metric"><div class="label">'+esc(String(label))+'</div><div class="value">'+esc(String(value))+'</div></div>';
}

function progressBarHTML(label, used, limit, pct, sub) {
  var color = pct < 60 ? 'var(--green)' : pct < 80 ? 'var(--gold)' : 'var(--red)';
  return '<div class="progress-wrap"><div class="progress-header"><span style="color:var(--muted)">'+esc(label)+'</span><span style="color:'+color+';font-weight:600">'+esc(String(used))+' / '+esc(String(limit))+' ('+pct.toFixed(0)+'%)</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+Math.min(pct,100)+'%;background:'+color+'"></div></div><div class="progress-sub">'+esc(String(sub))+'</div></div>';
}

// ── Analytics ──
async function loadAnalytics() {
  var results = await Promise.all([
    apiFetch('/admin/analytics/dau?days=30'),
    apiFetch('/admin/analytics/features?days=30'),
    apiFetch('/admin/analytics/retention?weeks=8'),
    apiFetch('/admin/analytics/timeline?limit=50'),
    apiFetch('/admin/analytics/storage'),
  ]);
  var dau=results[0], features=results[1], retention=results[2], timeline=results[3], storage=results[4];
  var s = (dau && dau.summary) || {};
  var st = storage || {};

  document.getElementById('summaryMetrics').innerHTML = [
    metricHTML('DAU (Today)', s.dau_today != null ? s.dau_today : '\u2014'),
    metricHTML('WAU (7d)', s.wau_7d != null ? s.wau_7d : '\u2014'),
    metricHTML('Events (30d)', (s.total_events_30d||0).toLocaleString()),
    metricHTML('Features', s.unique_features != null ? s.unique_features : '\u2014'),
    metricHTML('Total Storage', formatBytes(st.total_storage_bytes||0)),
    metricHTML('Sessions', st.total_sessions != null ? st.total_sessions : '\u2014'),
  ].join('');

  // DAU Chart
  if (dauChartInstance) dauChartInstance.destroy();
  var days = (dau && dau.days) || [];
  dauChartInstance = new Chart(document.getElementById('dauChart'), {
    type: 'line',
    data: {
      labels: days.map(function(d){ return new Date(d.date).toLocaleDateString('en',{month:'short',day:'numeric'}); }),
      datasets: [{ label:'Users', data:days.map(function(d){return d.users;}), borderColor:'#22c55e', backgroundColor:'rgba(34,197,94,0.1)', fill:true, tension:0.3, pointRadius:2 }]
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ x:{ticks:{color:'#949494',font:{size:11}},grid:{color:'rgba(255,255,255,0.05)'}}, y:{ticks:{color:'#949494'},grid:{color:'rgba(255,255,255,0.05)'},beginAtZero:true} } }
  });

  // Features
  var feats = (features && features.features) || [];
  var maxC = feats.length ? feats[0].count : 1;
  var featsEl = document.getElementById('featureBars');
  featsEl.innerHTML = '';
  feats.forEach(function(f) {
    featsEl.innerHTML += '<div class="bar-row"><div class="bar-label">'+esc(humanize(f.event_type))+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(f.count/maxC*100).toFixed(0)+'%">'+esc(String(f.count))+'</div></div><div class="bar-users">'+esc(String(f.unique_users))+' users</div></div>';
  });

  // Retention
  var cohorts = (retention && retention.cohorts) || [];
  var retEl = document.getElementById('retentionTable');
  if (cohorts.length) {
    var maxW = Math.max.apply(null, cohorts.map(function(c){return c.retention.length;}));
    var h = '<table><thead><tr><th>Cohort</th><th>Size</th>';
    for(var i=0;i<maxW;i++) h+='<th style="text-align:center">W'+i+'</th>';
    h+='</tr></thead><tbody>';
    cohorts.forEach(function(c){
      h+='<tr><td style="color:var(--muted)">'+esc(new Date(c.week).toLocaleDateString('en',{month:'short',day:'numeric'}))+'</td><td style="text-align:center;color:var(--muted)">'+c.size+'</td>';
      for(var i=0;i<maxW;i++){
        if(i<c.retention.length){ var p=c.retention[i]; h+='<td><div class="retention-cell" style="background:rgba(34,197,94,'+(p/100*0.35)+')">'+p+'%</div></td>'; }
        else h+='<td style="text-align:center;color:rgba(255,255,255,0.15)">\u2014</td>';
      }
      h+='</tr>';
    });
    h+='</tbody></table>';
    retEl.innerHTML = h;
  } else { retEl.innerHTML = '<p style="color:var(--muted);font-size:13px">No cohort data yet</p>'; }

  // Timeline
  var evts = (timeline && timeline.events) || [];
  var tlEl = document.getElementById('timelineList');
  if (evts.length) {
    tlEl.innerHTML = '';
    evts.forEach(function(e){
      tlEl.innerHTML += '<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)"><span style="font-size:11px;color:var(--muted);width:70px;font-variant-numeric:tabular-nums">'+esc(new Date(e.created_at).toLocaleTimeString())+'</span><span style="font-size:11px;color:rgba(255,255,255,0.5);width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(e.user_email)+'</span><span class="badge '+badgeClass(e.event_type)+'">'+esc(e.event_type)+'</span><span style="font-size:11px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(e.path||'')+'</span></div>';
    });
  } else { tlEl.innerHTML = '<p style="color:var(--muted);font-size:13px">No events yet</p>'; }
}

// ── Users ──
async function loadUsers() {
  var data = await apiFetch('/admin/users?limit=200');
  allUsers = (data && data.users) || [];
  renderUsers(allUsers);
}

function searchUsers() {
  var q = document.getElementById('userSearch').value.toLowerCase();
  renderUsers(allUsers.filter(function(u){ return (u.email||'').toLowerCase().indexOf(q)>=0 || (u.display_name||'').toLowerCase().indexOf(q)>=0; }));
}

function renderUsers(users) {
  var tbody = document.querySelector('#usersTable tbody');
  tbody.innerHTML = '';
  users.forEach(function(u){
    var statusBadge = u.suspended_at ? '<span class="badge badge-limit">Suspended</span>' : '<span class="badge badge-report">'+ esc(u.subscription_status||'free')+'</span>';
    tbody.innerHTML += '<tr class="user-row" onclick="showUserDetail('+u.id+')"><td><div style="color:var(--text);font-size:13px">'+esc(u.display_name||u.email)+'</div><div style="font-size:11px;color:var(--muted)">'+esc(u.email)+'</div></td><td style="color:var(--muted);font-size:13px">'+esc(u.plan_tier||'demo')+'</td><td>'+statusBadge+'</td><td style="color:var(--muted);font-size:13px">'+(u.created_at?esc(new Date(u.created_at).toLocaleDateString()):'\u2014')+'</td></tr>';
  });
}

async function showUserDetail(userId) {
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  var page = document.getElementById('page-user-detail');
  page.classList.add('active');
  page.innerHTML = '<div class="loading">Loading...</div>';

  var results = await Promise.all([
    apiFetch('/admin/users/'+userId),
    apiFetch('/admin/users/'+userId+'/activity'),
    apiFetch('/admin/users/'+userId+'/storage'),
  ]);
  var u=results[0]||{}, a=results[1]||{}, st=results[2]||{};
  var sPct = st.storage_pct || 0;
  var aPct = st.analyses_limit > 0 ? (st.analyses_used/st.analyses_limit*100) : 0;

  var html = '<div class="back-link" onclick="showPage(\'users\')">\u2190 Back to Users</div>';
  html += '<div class="user-header"><div class="avatar">'+esc((u.display_name||u.email||'?')[0].toUpperCase())+'</div><div><div class="user-name">'+esc(u.display_name||'Unknown')+'</div><div class="user-email">'+esc(u.email||'')+'</div></div><div style="margin-left:auto;display:flex;gap:8px;align-items:center"><span class="plan-badge">'+esc(st.plan_tier||u.plan_tier||'demo')+'</span>'+(u.created_at?'<span style="font-size:11px;color:var(--muted)">Joined '+esc(new Date(u.created_at).toLocaleDateString())+'</span>':'')+'</div></div>';

  html += '<div class="two-col"><div class="card"><h2>Activity (30 days)</h2><div class="mini-metrics"><div class="mini-metric"><div class="label">Events</div><div class="value">'+(a.events_30d||0)+'</div></div><div class="mini-metric"><div class="label">Last Active</div><div class="value" style="font-size:14px;color:var(--green)">'+(a.last_active?timeAgo(a.last_active):'Never')+'</div></div><div class="mini-metric"><div class="label">Sessions Viewed</div><div class="value">'+(a.sessions_viewed||0)+'</div></div><div class="mini-metric"><div class="label">Uploads</div><div class="value">'+(a.uploads_30d||0)+'</div></div></div><div style="font-size:11px;color:var(--muted);margin-bottom:8px">Top Features</div>';
  (a.top_features||[]).forEach(function(f){ html += '<div class="feature-row"><span class="name">'+esc(humanize(f.event_type))+'</span><span class="count">'+f.count+'</span></div>'; });
  html += '</div>';

  html += '<div class="card"><h2>Storage &amp; Reports</h2><div class="mini-metrics"><div class="mini-metric"><div class="label">Total Reports</div><div class="value">'+(st.total_reports||0)+'</div></div><div class="mini-metric"><div class="label">This Month</div><div class="value">'+(st.reports_this_month||0)+'</div></div><div class="mini-metric"><div class="label">Total Storage</div><div class="value">'+formatBytes(st.total_storage_bytes||0)+'</div></div><div class="mini-metric"><div class="label">Avg / Session</div><div class="value">'+formatBytes(st.avg_storage_per_session_bytes||0)+'</div></div></div>';
  html += progressBarHTML('Storage Used', formatBytes(st.total_storage_bytes||0), formatBytes(st.plan_storage_limit_bytes||0), sPct, formatBytes(Math.max(0,(st.plan_storage_limit_bytes||0)-(st.total_storage_bytes||0)))+' remaining');
  html += progressBarHTML('Analyses This Month', st.analyses_used||0, st.analyses_limit||0, aPct, Math.max(0,(st.analyses_limit||0)-(st.analyses_used||0))+' remaining');
  html += '</div></div>';

  html += '<div class="card"><h2>Recent Events</h2><table><thead><tr><th>Time</th><th>Event</th><th>Path</th></tr></thead><tbody>';
  (a.recent||[]).forEach(function(e){
    html += '<tr><td style="color:var(--muted);white-space:nowrap">'+esc(new Date(e.created_at).toLocaleString())+'</td><td><span class="badge '+badgeClass(e.event_type)+'">'+esc(e.event_type)+'</span></td><td style="color:var(--muted)">'+esc(e.path||'\u2014')+'</td></tr>';
  });
  html += '</tbody></table></div>';

  page.innerHTML = html;
}

document.getElementById('passwordInput').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
</script>
