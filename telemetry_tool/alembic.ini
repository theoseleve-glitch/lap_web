# Alembic configuration for Telemetry SaaS PostgreSQL migrations
#
# The database URL is read from the TELEMETRY_PG_URL environment variable
# at runtime (see alembic/env.py). The placeholder below is only used
# if the env var is not set.

[alembic]
script_location = alembic
prepend_sys_path = .

# Default connection string — overridden by TELEMETRY_PG_URL env var.
sqlalchemy.url = postgresql://telemetry:telemetry@localhost:5432/telemetry

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
