{% extends "base.html" %}

{% block title %}Analytics — Telemetry{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Advanced Analytics</h1>
    <p class="text-muted">Deep-dive analysis tools for understanding performance trends.</p>
</div>

<nav aria-label="Analytics tools">
<div class="analytics-grid mt-lg">
{% for tool in tools %}
    <a href="{{ tool.url }}" class="analytics-tool-link">
        <div class="analytics-tool-card elevation-1 card-interactive">
            <h3 class="analytics-tool-name">{{ tool.name }}</h3>
            <p class="analytics-tool-desc">{{ tool.desc }}</p>
        </div>
    </a>
{% endfor %}
</div>
</nav>
{% endblock %}
