{% extends "base.html" %}
{% block title %}Sector Comparison{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Cross-Session Sector Comparison</h1>
</div>

<section class="section">
    <div style="display:flex;gap:0.8rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem;">
        <div class="form-group" style="min-width:180px;">
            <label for="sc-driver">Driver</label>
            <select id="sc-driver" class="form-select">
                <option value="">Select driver...</option>
                {% for d in drivers %}
                <option value="{{ d.driver_id }}">{{ d.driver_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group" style="min-width:180px;">
            <label for="sc-track">Track</label>
            <select id="sc-track" class="form-select">
                <option value="">Select track...</option>
                {% for t in tracks %}
                <option value="{{ t.track_id }}">{{ t.track_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group" style="min-width:100px;">
            <label for="sc-sectors">Sectors</label>
            <select id="sc-sectors" class="form-select">
                <option value="3" selected>3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>
        </div>
        <button type="button" class="btn btn-primary" id="sc-analyze-btn">Analyze</button>
    </div>
</section>

<!-- Results -->
<section class="section" id="sc-results" style="display:none;">
    <h2>Sector Performance</h2>
    <div id="sc-stats" style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;"></div>
    <canvas id="sc-canvas" width="800" height="300" style="width:100%;max-width:800px;" aria-label="Sector comparison chart"></canvas>
    <div id="sc-table" style="margin-top:1rem;"></div>
    <div id="sc-coaching" style="margin-top:0.8rem;"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
(function() {
    var _lastData = null;

    document.getElementById('sc-analyze-btn').addEventListener('click', function() {
        var driverId = document.getElementById('sc-driver').value;
        var trackId = document.getElementById('sc-track').value;
        var nSectors = document.getElementById('sc-sectors').value;
        if (!driverId || !trackId) {
            if (window.Toast) Toast.show('Select a driver and track', 'warning');
            return;
        }
        var url = '/api/sector-comparison/' + driverId + '/' + encodeURIComponent(trackId) + '?n_sectors=' + nSectors;
        FetchHelper.fetch(url)
            .then(function(data) {
                if (data.error) {
                    if (window.Toast) Toast.show(data.error, 'error');
                    document.getElementById('sc-results').style.display = 'none';
                    return;
                }
                _lastData = data;
                document.getElementById('sc-results').style.display = '';
                _renderStats(data);
                setTimeout(function() { _drawChart(data); }, 30);
                _renderTable(data);
                _renderCoaching(data);
            })
            .catch(function(err) {
                if (window.Toast) Toast.show('Failed to load sector comparison', 'error');
            });
    });

    function _card(label, value, color) {
        return '<div style="background:var(--card-bg);border-radius:8px;padding:0.3rem 0.6rem;text-align:center;min-width:90px;">' +
            '<div style="font-size:0.6rem;color:var(--text-secondary);text-transform:uppercase;">' + esc(label) + '</div>' +
            '<div style="font-size:0.9rem;font-weight:700;color:' + color + ';">' + esc(String(value)) + '</div></div>';
    }

    function _renderStats(data) {
        var el = document.getElementById('sc-stats');
        var html = '';
        html += _card('Sessions', data.n_sessions, 'var(--text-primary)');
        html += _card('Sectors', data.n_sectors, '#36a2eb');
        if (data.ideal_cross_session_lap_s) {
            html += _card('Ideal Lap', data.ideal_cross_session_lap_s.toFixed(3) + 's', '#4caf50');
        }
        // Find weakest sector (biggest spread)
        var ss = data.sector_summary || [];
        if (ss.length > 0) {
            var weakest = ss.reduce(function(a, b) { return a.spread_s > b.spread_s ? a : b; });
            html += _card('Weakest', weakest.sector + ' (' + weakest.spread_s.toFixed(3) + 's)', '#e74c3c');
        }
        el.innerHTML = html;
    }

    function _drawChart(data) {
        var canvas = document.getElementById('sc-canvas');
        if (!canvas || !data.sector_summary || data.sector_summary.length === 0) return;
        var dpr = window.devicePixelRatio || 1;
        var W = canvas.parentElement.clientWidth || 800;
        var H = 300;
        canvas.width = W * dpr; canvas.height = H * dpr;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        var ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        var pad = {top: 20, right: 20, bottom: 40, left: 60};
        var pW = W - pad.left - pad.right, pH = H - pad.top - pad.bottom;
        ctx.clearRect(0, 0, W, H);

        var ss = data.sector_summary;
        var n = ss.length;
        var allBest = ss.map(function(s) { return s.best_s; });
        var allWorst = ss.map(function(s) { return s.worst_s; });
        var mn = Math.min.apply(null, allBest) * 0.98;
        var mx = Math.max.apply(null, allWorst) * 1.02;
        var range = mx - mn || 1;

        var barW = pW / n * 0.6;
        var gap = pW / n;

        // Draw bars: best (green) and spread (orange overlay)
        ss.forEach(function(s, i) {
            var x = pad.left + i * gap + gap * 0.2;
            var bestH = ((s.best_s - mn) / range) * pH;
            var worstH = ((s.worst_s - mn) / range) * pH;

            // Worst bar (background)
            ctx.fillStyle = 'rgba(255, 99, 132, 0.3)';
            ctx.fillRect(x, pad.top + pH - worstH, barW, worstH);

            // Best bar (foreground)
            ctx.fillStyle = 'rgba(76, 175, 80, 0.7)';
            ctx.fillRect(x, pad.top + pH - bestH, barW, bestH);

            // Spread indicator
            if (s.spread_s > 0) {
                var spreadY = pad.top + pH - worstH;
                var spreadH = worstH - bestH;
                ctx.fillStyle = 'rgba(255, 165, 0, 0.15)';
                ctx.fillRect(x, spreadY, barW, spreadH);
            }

            // Label
            ctx.fillStyle = '#ddd'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
            ctx.fillText(s.sector, x + barW / 2, H - pad.bottom + 16);

            // Values
            ctx.font = '9px system-ui';
            ctx.fillStyle = '#4caf50';
            ctx.fillText(s.best_s.toFixed(3) + 's', x + barW / 2, pad.top + pH - bestH - 4);
            if (s.spread_s > 0.01) {
                ctx.fillStyle = '#ff6384';
                ctx.fillText('+' + s.spread_s.toFixed(3), x + barW / 2, pad.top + pH - worstH - 4);
            }
        });

        // Y axis
        ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(pad.left, pad.top + pH); ctx.lineTo(pad.left + pW, pad.top + pH); ctx.stroke();

        ctx.fillStyle = '#888'; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
        for (var t = mn; t <= mx; t += range / 5) {
            var yy = pad.top + pH - ((t - mn) / range) * pH;
            ctx.fillText(t.toFixed(2) + 's', pad.left - 4, yy + 3);
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.beginPath(); ctx.moveTo(pad.left, yy); ctx.lineTo(W - pad.right, yy); ctx.stroke();
        }

        // Legend
        ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(76, 175, 80, 0.7)'; ctx.fillText('Best', W - 10, 14);
        ctx.fillStyle = 'rgba(255, 99, 132, 0.5)'; ctx.fillText('Worst', W - 10, 26);
    }

    function _renderTable(data) {
        var el = document.getElementById('sc-table');
        var ss = data.sector_summary || [];
        if (ss.length === 0) { el.innerHTML = ''; return; }
        var html = '<table class="data-table compact striped"><thead><tr>';
        html += '<th>Sector</th><th>Best (s)</th><th>Worst (s)</th><th>Spread (s)</th><th>Sessions</th></tr></thead><tbody>';
        ss.forEach(function(s) {
            var spreadCol = s.spread_s < 0.1 ? '#4caf50' : s.spread_s < 0.3 ? '#ff9800' : '#e74c3c';
            html += '<tr>';
            html += '<td><strong>' + esc(s.sector) + '</strong></td>';
            html += '<td>' + s.best_s.toFixed(3) + '</td>';
            html += '<td>' + s.worst_s.toFixed(3) + '</td>';
            html += '<td style="color:' + spreadCol + ';font-weight:600;">' + s.spread_s.toFixed(3) + '</td>';
            html += '<td>' + s.n_sessions + '</td>';
            html += '</tr>';
        });
        html += '</tbody></table>';
        el.innerHTML = html;
    }

    function _renderCoaching(data) {
        var el = document.getElementById('sc-coaching');
        var ss = data.sector_summary || [];
        if (ss.length === 0) { el.innerHTML = ''; return; }

        var html = '<div style="font-size:0.75rem;color:var(--text-secondary);text-transform:uppercase;margin-bottom:0.3rem;">Coaching Insights</div>';

        // Find weakest sector
        var weakest = ss.reduce(function(a, b) { return a.spread_s > b.spread_s ? a : b; });
        var strongest = ss.reduce(function(a, b) { return a.spread_s < b.spread_s ? a : b; });

        html += '<div style="font-size:0.8rem;margin-bottom:0.3rem;">Your most consistent sector is <strong style="color:#4caf50;">' + esc(strongest.sector) + '</strong> (spread: ' + strongest.spread_s.toFixed(3) + 's)</div>';
        html += '<div style="font-size:0.8rem;margin-bottom:0.3rem;">Focus area: <strong style="color:#e74c3c;">' + esc(weakest.sector) + '</strong> has the most variation (spread: ' + weakest.spread_s.toFixed(3) + 's)</div>';

        if (data.ideal_cross_session_lap_s && data.sessions && data.sessions.length > 0) {
            var bestActual = Math.min.apply(null, data.sessions.filter(function(s) { return s.best_lap_time_s; }).map(function(s) { return s.best_lap_time_s; }));
            var gap = bestActual - data.ideal_cross_session_lap_s;
            if (gap > 0.001) {
                html += '<div style="font-size:0.8rem;margin-bottom:0.3rem;">Your ideal cross-session lap is <strong style="color:#36a2eb;">' + data.ideal_cross_session_lap_s.toFixed(3) + 's</strong> — ' + gap.toFixed(3) + 's faster than your actual best.</div>';
            }
        }

        el.innerHTML = html;
    }

    // Debounced resize
    var _scResizeTimer = null;
    window.addEventListener('resize', function() {
        clearTimeout(_scResizeTimer);
        _scResizeTimer = setTimeout(function() { if (_lastData) _drawChart(_lastData); }, 250);
    });
})();
</script>
{% endblock %}
