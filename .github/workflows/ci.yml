name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  check-api-security-headers:
    runs-on: ubuntu-latest
    env:
      API_PREVIEW_URL: ${{ vars.API_PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate preview endpoint is configured
        run: |
          if [ -z "${API_PREVIEW_URL}" ]; then
            echo "API_PREVIEW_URL repo variable is required for header regression checks" >&2
            exit 1
          fi

      - name: Check API security headers on preview
        run: scripts/check_api_security_headers.sh "${API_PREVIEW_URL}" /healthz
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run telemetry_tool tests
        run: pytest telemetry_tool/tests/ -q --tb=short

      - name: Run kart_envelope tests
        run: pytest kart_envelope/tests/ -q --tb=short

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lap-website
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lap-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API contract tests
        run: pytest telemetry_tool/tests/test_api_contracts.py -v --tb=short

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lap-website
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lap-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Start API server
        env:
          USE_PG: "0"
          AUTH_REQUIRED: "0"
        run: cd telemetry_tool && python main.py --serve &

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lap-website/package-lock.json

      - name: Install frontend dependencies
        working-directory: lap-website
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: lap-website
        run: npx playwright install chromium

      - name: Run E2E smoke tests
        working-directory: lap-website
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: npx playwright test e2e/critical-path.spec.ts --project=chromium

  deploy-api:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, contract-tests, typecheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/lap-api
            git pull origin main
            docker compose -f docker-compose.prod.yml build api celery-pipeline celery-default
            docker compose -f docker-compose.prod.yml up -d api celery-pipeline celery-default celery-beat
            # Run pending migrations
            docker compose -f docker-compose.prod.yml exec -T api python -c "
            import subprocess; subprocess.run(['alembic', 'upgrade', 'head'], cwd='/app/telemetry_tool', check=True)
            "
            # Verify health
            sleep 5
            curl -sf http://localhost:5000/healthz || exit 1
            echo "Deploy successful"

  parity-smoke:
    runs-on: ubuntu-latest
    needs: [deploy-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lap-website/package-lock.json

      - name: Install frontend dependencies
        working-directory: lap-website
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: lap-website
        run: npx playwright install chromium

      - name: Run certification parity tests against live
        working-directory: lap-website
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_PREVIEW_URL }}
        run: npx playwright test e2e/certification-parity.spec.ts --project=chromium
