name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Quality gates (run on every PR + push to main) ────────

  check-api-security-headers:
    runs-on: ubuntu-latest
    env:
      API_PREVIEW_URL: ${{ vars.API_PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate preview endpoint is configured
        run: |
          if [ -z "${API_PREVIEW_URL}" ]; then
            echo "API_PREVIEW_URL repo variable is required for header regression checks" >&2
            exit 1
          fi

      - name: Check API security headers on preview
        run: scripts/check_api_security_headers.sh "${API_PREVIEW_URL}" /healthz

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Run telemetry_tool tests with coverage
        run: pytest telemetry_tool/tests/ -q --tb=short --cov=telemetry_tool --cov-report=term-missing --cov-fail-under=30

      - name: Run kart_envelope tests
        run: pytest kart_envelope/tests/ -q --tb=short

      - name: Run domain unit tests (fast, deterministic)
        run: pytest tests/ -m domain -q --tb=short

      - name: Run filter profile tests
        run: pytest tests/test_filter_profile.py -q --tb=short

      - name: Run vehicle override tests
        run: pytest tests/test_vehicle_overrides.py -q --tb=short

  test-golden-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate golden datasets
        run: python tests/golden/generate_golden.py

      - name: Run golden regression tests (full pipeline)
        run: pytest tests/golden/test_golden_regression.py -m regression -v --tb=short

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lap-website
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lap-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Content linters (placeholders, copy standards, links)
        run: npm run lint:placeholders && npm run lint:standards && npm run lint:links

      - name: Content linters (feature-case, i18n, page-template, faq)
        run: npm run lint:feature-case && npm run lint:i18n-ready && npm run lint:page-template && npm run lint:faq

      - name: Spellcheck (cspell)
        run: npm run lint:spelling

      - name: Design system linters (icon imports, token audit)
        run: npm run lint:icon-imports && npm run lint:design-tokens

      - name: Content approval gate
        if: github.event_name == 'pull_request'
        run: node scripts/ci-content-approval.mjs
        working-directory: lap-website

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check requirements.txt completeness
        run: python scripts/check_requirements.py

      - name: Run mypy type checks
        run: mypy

      - name: Check import ordering (isort)
        run: isort --check-only --diff telemetry_tool/ kart_envelope/ tests/

      - name: Lint Python (ruff)
        run: ruff check telemetry_tool/ kart_envelope/ tests/

      - name: Track TODO/FIXME/HACK count
        run: |
          echo "── TODO/FIXME/HACK inventory ──"
          COUNT=$(grep -rn "TODO\|FIXME\|HACK\|XXX" telemetry_tool/ --include="*.py" | wc -l)
          echo "Total: $COUNT"
          grep -rn "TODO\|FIXME\|HACK\|XXX" telemetry_tool/ --include="*.py" | head -20 || true
          echo "---"
          echo "::notice::$COUNT TODO/FIXME/HACK comments in telemetry_tool/"

      - name: Code complexity report
        run: |
          pip install radon
          echo "── Cyclomatic complexity (CC > 15 = warning) ──"
          radon cc telemetry_tool/ -a -nc --min C | head -50
          echo ""
          echo "── Maintainability index (< 20 = hard to maintain) ──"
          radon mi telemetry_tool/ --min B | head -30
          echo ""
          WORST=$(radon cc telemetry_tool/ -nc --min F -s 2>/dev/null | head -5)
          if [ -n "$WORST" ]; then
            echo "::warning::Functions with very high complexity (F-grade):"
            echo "$WORST"
          fi

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bandit security linter
        run: |
          pip install bandit[toml]
          echo "── Bandit SAST scan ──"
          bandit -r telemetry_tool/ kart_envelope/ \
            -ll \
            --skip B101,B404,B603 \
            -f json -o bandit-report.json || true
          bandit -r telemetry_tool/ kart_envelope/ \
            -ll \
            --skip B101,B404,B603 \
            -f screen | head -100
          HIGH=$(python -c "import json; r=json.load(open('bandit-report.json')); print(sum(1 for i in r.get('results',[]) if i['issue_severity']=='HIGH'))")
          echo "High-severity issues: $HIGH"
          if [ "$HIGH" -gt 0 ]; then
            echo "::warning::Bandit found $HIGH high-severity issues"
          fi

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          echo "── pip-audit dependency scan ──"
          pip-audit --strict --desc 2>&1 | head -50 || true
          pip-audit --format json 2>/dev/null | python -c "
          import json,sys
          try:
            data = json.load(sys.stdin)
            vulns = data.get('dependencies', [])
            critical = [v for v in vulns if v.get('vulns')]
            if critical:
              print(f'::warning::{len(critical)} packages with known vulnerabilities')
          except: pass
          " || true

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API contract tests
        run: pytest telemetry_tool/tests/test_api_contracts.py -v --tb=short

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lap-website
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lap-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── Dead code detection (unused exports/files) ───────────

  dead-code:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lap-website
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lap-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run knip (unused exports/files)
        run: npx knip --no-exit-code --reporter compact
        continue-on-error: true

  # ── Migration safety (fresh PG, upgrade/downgrade) ────────

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: telemetry
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: telemetry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telemetry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migration safety checks
        env:
          TELEMETRY_PG_URL: postgresql://telemetry:testpass@localhost:5432/telemetry
        run: |
          cd telemetry_tool

          echo "── 1. Upgrade to head on fresh DB"
          alembic upgrade head

          echo "── 2. Verify current == head"
          CURRENT=$(alembic current 2>/dev/null | grep -oP '^\w+' | head -1)
          HEAD=$(alembic heads 2>/dev/null | grep -oP '^\w+' | head -1)
          echo "current=$CURRENT head=$HEAD"
          [ "$CURRENT" = "$HEAD" ] || { echo "MISMATCH"; exit 1; }

          echo "── 3. Downgrade one step (reversibility)"
          alembic downgrade -1

          echo "── 4. Re-upgrade to head"
          alembic upgrade head

          echo "Migration checks PASSED"

  # ── Performance budget ────────────────────────────────────

  perf-budget:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: lap-website
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lap-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and measure bundle
        run: |
          npm run build

          echo "── Bundle size check"
          if [ -d .next/static/chunks ]; then
            TOTAL_KB=$(du -sk .next/static/chunks/ | cut -f1)
            echo "Total chunks: ${TOTAL_KB} KB"
            if [ "$TOTAL_KB" -gt 5000 ]; then
              echo "FAIL: Total chunks ${TOTAL_KB} KB exceeds 5000 KB budget"
              exit 1
            fi
          fi
          echo "Bundle size within budget"

  # ── E2E smoke (local API) ─────────────────────────────────

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Start API server
        env:
          USE_PG: "0"
          AUTH_REQUIRED: "0"
        run: cd telemetry_tool && python main.py --serve &

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lap-website/package-lock.json

      - name: Install frontend dependencies
        working-directory: lap-website
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: lap-website
        run: npx playwright install chromium

      - name: Run E2E smoke tests
        working-directory: lap-website
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: npx playwright test e2e/critical-path.spec.ts --project=chromium

  # ── Deploy to staging (on push to main) ───────────────────

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test-backend, test-golden-regression, test-frontend, contract-tests, typecheck, migration-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      STAGING_HOST: ${{ secrets.STAGING_VPS_HOST }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/lap-api
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            DEPLOY_SHA=$(git rev-parse --short HEAD)

            docker compose -f docker-compose.staging.yml build \
              --build-arg DEPLOY_SHA="$DEPLOY_SHA" \
              api celery-pipeline celery-default

            # Migrations BEFORE deploying new code
            docker compose -f docker-compose.staging.yml run --rm api \
              alembic -c /app/telemetry_tool/alembic.ini upgrade head

            # Tag previous image for rollback
            docker tag lap-api_api:latest lap-api_api:previous 2>/dev/null || true

            docker compose -f docker-compose.staging.yml up -d \
              api celery-pipeline celery-default celery-beat

            sleep 5
            curl -sf http://localhost:5000/healthz || exit 1
            echo "Staging deploy: $DEPLOY_SHA"

  # ── Staging smoke test (external) ─────────────────────────

  staging-smoke:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      STAGING_URL: ${{ vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests against staging
        run: |
          chmod +x scripts/smoke_test.sh
          scripts/smoke_test.sh "$STAGING_URL" --write

  # ── Deploy to production (manual approval gate) ───────────

  deploy-production:
    runs-on: ubuntu-latest
    needs: [staging-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production  # GitHub environment with required reviewers
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/lap-api
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            DEPLOY_SHA=$(git rev-parse --short HEAD)

            # Tag previous image for rollback
            docker tag lap-api_api:latest lap-api_api:previous 2>/dev/null || true

            docker compose -f docker-compose.prod.yml build \
              --build-arg DEPLOY_SHA="$DEPLOY_SHA" \
              api celery-pipeline celery-default

            # Migrations BEFORE deploy
            docker compose -f docker-compose.prod.yml run --rm api \
              alembic -c /app/telemetry_tool/alembic.ini upgrade head

            docker compose -f docker-compose.prod.yml up -d \
              api celery-pipeline celery-default celery-beat

            sleep 5
            curl -sf http://localhost:5000/healthz || {
              echo "HEALTH CHECK FAILED — rolling back"
              docker tag lap-api_api:previous lap-api_api:latest
              docker compose -f docker-compose.prod.yml up -d api
              exit 1
            }
            echo "Production deploy: $DEPLOY_SHA"

  # ── Production smoke test ─────────────────────────────────

  production-smoke:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      PROD_URL: ${{ vars.API_PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests against production
        run: |
          chmod +x scripts/smoke_test.sh
          scripts/smoke_test.sh "$PROD_URL"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lap-website/package-lock.json

      - name: Install and run parity tests
        working-directory: lap-website
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_PREVIEW_URL }}
        run: |
          npm ci
          npx playwright install chromium
          npx playwright test e2e/certification-parity.spec.ts --project=chromium
