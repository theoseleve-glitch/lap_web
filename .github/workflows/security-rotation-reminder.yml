name: Secret Rotation Reminder

on:
  schedule:
    - cron: "0 9 1 */3 *" # 1st of every 3rd month at 09:00 UTC

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create rotation reminder issue
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] Quarterly secret rotation due — ${today}`,
              body: `## Secret Rotation Due\n\nPer the [rotation runbook](docs/security-rotation-runbook.md), the following secrets are due for rotation:\n\n- [ ] \`TELEMETRY_SECRET_KEY\`\n- [ ] \`TELEMETRY_JWT_SECRET\`\n- [ ] \`PG_PASSWORD\`\n- [ ] Review Stripe/OAuth secrets (semi-annual)\n- [ ] Review VPS SSH key (annual)\n\nSee \`docs/security-rotation-runbook.md\` for procedures.`,
              labels: ['security', 'maintenance']
            });
