name: friction-validation

# Run unit tests + smoke release gate on PRs that touch the friction stack.
# The smoke gate runs the validation pipeline against a single small dataset,
# so it stays under a couple of minutes. Full cross-track runs are reserved
# for nightly / on-demand jobs.

on:
  pull_request:
    paths:
      - "telemetry_tool/track_surface/**"
      - "telemetry_tool/tests/test_*surface*.py"
      - "telemetry_tool/tests/test_release_gate.py"
      - "telemetry_tool/tests/test_persistence_layer.py"
      - "telemetry_tool/tests/test_cross_track_validation.py"
      - "telemetry_tool/tests/test_transition_gate.py"
      - "telemetry_tool/tests/test_ops.py"
      - "data/release_thresholds.json"
      - "data/cross_track_manifest.json"
      - "data/vehicle_calibrations.json"
      - "scripts/release_gate.py"
      - "scripts/ops.py"
  workflow_dispatch:

jobs:
  unit-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run friction-stack unit + regression tests
        run: |
          python -m pytest \
            telemetry_tool/tests/test_release_gate.py \
            telemetry_tool/tests/test_ops.py \
            telemetry_tool/tests/test_transition_gate.py \
            telemetry_tool/tests/test_persistence_layer.py \
            telemetry_tool/tests/test_cross_track_validation.py \
            telemetry_tool/tests/test_robust_ocp.py \
            telemetry_tool/tests/test_condition_bucketing.py \
            telemetry_tool/tests/test_surface_field.py \
            telemetry_tool/tests/test_surface_inverse.py \
            telemetry_tool/tests/test_tire_model.py \
            telemetry_tool/tests/test_tire_parameter_fit.py \
            telemetry_tool/tests/test_roll_compliance_fit.py \
            -v --tb=short

  validate-config-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate manifest schema
        run: |
          python scripts/ops.py --json validate-manifest \
            --manifest data/cross_track_manifest.json
      - name: Sanity-load thresholds + registry
        run: |
          python -c "
          import sys; sys.path.insert(0, 'telemetry_tool')
          from track_surface.validation.release_gate import ReleaseThresholds
          from track_surface.vehicle_calibration_registry import VehicleCalibrationRegistry
          rt = ReleaseThresholds.from_json('data/release_thresholds.json')
          assert rt.default is not None, 'default missing'
          reg = VehicleCalibrationRegistry.load('data/vehicle_calibrations.json')
          print(f'{len(reg.profiles)} calibration profile(s) loaded')
          for p in reg.profiles:
              assert p.profile_id, 'empty profile_id'
              assert not (p.active and p.deprecated)
          print('release_thresholds.json + vehicle_calibrations.json OK')
          "

  smoke-release-gate:
    runs-on: ubuntu-latest
    needs: [unit-and-regression, validate-config-files]
    # Smoke release gate: this requires real .ibt files which won't typically
    # be present in CI. The job is wired up so it can run on a self-hosted
    # runner with the data mounted, but here we only verify the gate command
    # itself wires up correctly (--help) on hosted CI.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify release_gate.py wiring (--help)
        run: python scripts/release_gate.py --help
      - name: Verify ops.py wiring (--help)
        run: python scripts/ops.py --help
      # On a self-hosted runner with telemetry data mounted at /data:
      # - name: Run smoke release gate
      #   run: |
      #     python scripts/release_gate.py --smoke \
      #       --manifest data/cross_track_manifest.json \
      #       --thresholds data/release_thresholds.json \
      #       --registry data/vehicle_calibrations.json \
      #       --accumulator-dir /tmp/accumulators_ci \
      #       --out release_artifacts/
      # - name: Upload release artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: release-artifacts
      #     path: release_artifacts/
