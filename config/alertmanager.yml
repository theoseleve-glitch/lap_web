# Alertmanager configuration
# Update receiver URLs before deploying

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h

receivers:
  - name: "default"
    webhook_configs:
      # Discord/Slack webhook — replace with your URL
      - url: "${ALERT_WEBHOOK_URL:-http://localhost:9999/null}"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "${ALERT_WEBHOOK_URL:-http://localhost:9999/null}"
        send_resolved: true
    # email_configs:
    #   - to: "oncall@lap-coach.racing"
    #     from: "alerts@lap-coach.racing"
    #     smarthost: "smtp.example.com:587"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
