# Log rotation for Lap API Docker containers
# Install: cp config/logrotate-lap-api.conf /etc/logrotate.d/lap-api
#
# Docker JSON logs grow unbounded by default — this caps them.

/var/lib/docker/containers/*/*.log {
    rotate 7
    daily
    compress
    delaycompress
    missingok
    notifempty
    maxsize 100M
    copytruncate
}
