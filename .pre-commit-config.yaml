repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: backend-fast-tests
        name: Backend fast tests
        entry: python -m pytest telemetry_tool/tests/test_cors.py telemetry_tool/tests/test_api_contracts.py -q --tb=line -x
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
