version: "3.9"

services:
  api:
    build: .
    env_file: .env.production
    environment:
      TELEMETRY_LOG_FORMAT: json
      SENTRY_DSN_API: ${SENTRY_DSN_API}
      SENTRY_ENVIRONMENT: production
    volumes:
      - upload_data:/data/uploads
      - parquet_data:/data/parquet
      - export_data:/data/exports
      - models_data:/data/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: telemetry
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=5000"
      - "-c"
      - "pg_stat_statements.track=top"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgresql://telemetry:${PG_PASSWORD}@postgres:5432/telemetry
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 100
      MAX_DB_CONNECTIONS: 20
      SERVER_RESET_QUERY: DISCARD ALL
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U telemetry || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    env_file: .env.production
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  celery-pipeline:
    build: .
    command: >
      celery -A telemetry_tool.celery_app worker
      -Q pipeline
      --concurrency=2
      --soft-time-limit=1800
      --time-limit=2100
      --max-tasks-per-child=50
      -l info
    env_file: .env.production
    environment:
      TELEMETRY_LOG_FORMAT: json
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER}
      SENTRY_ENVIRONMENT: production
    volumes:
      - upload_data:/data/uploads
      - parquet_data:/data/parquet
      - models_data:/data/models
    healthcheck:
      test: ["CMD-SHELL", "celery -A telemetry_tool.celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  celery-default:
    build: .
    command: >
      celery -A telemetry_tool.celery_app worker
      -Q default
      --concurrency=4
      --soft-time-limit=600
      --time-limit=900
      --max-tasks-per-child=200
      -l info
    env_file: .env.production
    environment:
      TELEMETRY_LOG_FORMAT: json
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER}
      SENTRY_ENVIRONMENT: production
    healthcheck:
      test: ["CMD-SHELL", "celery -A telemetry_tool.celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  celery-beat:
    build: .
    command: >
      celery -A telemetry_tool.celery_app beat
      -l info
      --schedule /tmp/celerybeat-schedule
    env_file: .env.production
    environment:
      TELEMETRY_LOG_FORMAT: json
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER}
      SENTRY_ENVIRONMENT: production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - internal

volumes:
  pgdata:
  upload_data:
  parquet_data:
  export_data:
  models_data:
  caddy_data:
  caddy_config:

networks:
  internal:
