version: "3.9"

services:
  api:
    build: .
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - TELEMETRY_USE_PG=1
      - TELEMETRY_PG_URL=postgresql://telemetry:${PG_PASSWORD}@postgres:5432/telemetry
      - CELERY_BROKER_URL=redis://redis:6379/0

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: telemetry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery-worker:
    build: .
    command: celery -A celery_app worker -l info
    env_file: .env
    depends_on:
      - redis
      - postgres
    environment:
      - TELEMETRY_USE_PG=1
      - TELEMETRY_PG_URL=postgresql://telemetry:${PG_PASSWORD}@postgres:5432/telemetry
      - CELERY_BROKER_URL=redis://redis:6379/0
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
