version: "3.9"

services:
  api:
    build: .
    env_file: .env.production
    environment:
      TELEMETRY_LOG_FORMAT: json
      SENTRY_DSN_API: ${SENTRY_DSN_API}
      SENTRY_ENVIRONMENT: production
      SIDECAR_ROOT: /data/sidecars
    volumes:
      - upload_data:/data/uploads
      - parquet_data:/data/parquet
      - export_data:/data/exports
      - models_data:/data/models
      - sidecar_data:/data/sidecars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: telemetry
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=5000"
      - "-c"
      - "pg_stat_statements.track=top"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgresql://telemetry:${PG_PASSWORD}@postgres:5432/telemetry
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 100
      MAX_DB_CONNECTIONS: 20
      SERVER_RESET_QUERY: DISCARD ALL
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U telemetry || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    env_file: .env.production
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  celery-pipeline:
    build: .
    command: >
      celery -A telemetry_tool.celery_app worker
      -Q pipeline
      --concurrency=2
      --soft-time-limit=1800
      --time-limit=2100
      --max-tasks-per-child=50
      -l info
    env_file: .env.production
    environment:
      TELEMETRY_LOG_FORMAT: json
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER}
      SENTRY_ENVIRONMENT: production
      SIDECAR_ROOT: /data/sidecars
    volumes:
      - upload_data:/data/uploads
      - parquet_data:/data/parquet
      - models_data:/data/models
      - sidecar_data:/data/sidecars
    healthcheck:
      test: ["CMD-SHELL", "celery -A telemetry_tool.celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  celery-default:
    build: .
    command: >
      celery -A telemetry_tool.celery_app worker
      -Q default
      --concurrency=4
      --soft-time-limit=600
      --time-limit=900
      --max-tasks-per-child=200
      -l info
    env_file: .env.production
    environment:
      TELEMETRY_LOG_FORMAT: json
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER}
      SENTRY_ENVIRONMENT: production
      SIDECAR_ROOT: /data/sidecars
    volumes:
      - sidecar_data:/data/sidecars
    healthcheck:
      test: ["CMD-SHELL", "celery -A telemetry_tool.celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  # Dedicated worker for endurance analysis jobs (fix: these used to run on
  # `celery-pipeline` and could pin that shared queue for up to 35 min per
  # job — SIGKILLed by the blanket --time-limit before their own 60-min soft
  # limit could fire — stalling every other customer's ordinary uploads.
  # Isolated onto its own queue + worker with bounded concurrency=1 so an
  # endurance job can never starve the pipeline queue again. Limits mirror
  # tasks/endurance_tasks.py ENDURANCE_SOFT_TIME_LIMIT_S / ENDURANCE_HARD_TIME_LIMIT_S.
  celery-endurance:
    build: .
    command: >
      celery -A telemetry_tool.celery_app worker
      -Q endurance
      --concurrency=1
      --soft-time-limit=3600
      --time-limit=3900
      --max-tasks-per-child=20
      -l info
    env_file: .env.production
    environment:
      TELEMETRY_LOG_FORMAT: json
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER}
      SENTRY_ENVIRONMENT: production
      SIDECAR_ROOT: /data/sidecars
    volumes:
      - upload_data:/data/uploads
      - parquet_data:/data/parquet
      - models_data:/data/models
      - sidecar_data:/data/sidecars
    healthcheck:
      test: ["CMD-SHELL", "celery -A telemetry_tool.celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  # Dedicated worker for pipeline jobs whose tier grace exceeds the shared
  # `celery-pipeline` worker's blanket --time-limit=2100 above (FIX #5,
  # customer readiness: the tier-timeout fix that threads
  # sig.set(time_limit=...) per stage let the b2b tier's 3900s hard limit
  # legitimately occupy 1 of only 2 shared `pipeline` slots for ~65 min,
  # stalling every other tenant's ordinary uploads — two concurrent b2b jobs
  # fully stalled the shared queue). Mirrors celery-endurance's isolation
  # pattern; jobs are routed here at dispatch time by
  # tasks.pipeline_tasks.pipeline_queue_for_tier (web/routes/sessions_v2.py)
  # rather than shrinking the paid b2b grace. --soft-time-limit/--time-limit
  # match TIER_TIMEOUTS_S["b2b"] + HARD_LIMIT_MARGIN_S (the longest tier
  # grace that can be dispatched here).
  celery-pipeline-long:
    build: .
    command: >
      celery -A telemetry_tool.celery_app worker
      -Q pipeline_long
      --concurrency=1
      --soft-time-limit=3600
      --time-limit=3900
      --max-tasks-per-child=20
      -l info
    env_file: .env.production
    environment:
      TELEMETRY_LOG_FORMAT: json
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER}
      SENTRY_ENVIRONMENT: production
      SIDECAR_ROOT: /data/sidecars
    volumes:
      - upload_data:/data/uploads
      - parquet_data:/data/parquet
      - models_data:/data/models
      - sidecar_data:/data/sidecars
    healthcheck:
      test: ["CMD-SHELL", "celery -A telemetry_tool.celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  celery-beat:
    build: .
    command: >
      celery -A telemetry_tool.celery_app beat
      -l info
      --schedule /tmp/celerybeat-schedule
    env_file: .env.production
    environment:
      TELEMETRY_LOG_FORMAT: json
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER}
      SENTRY_ENVIRONMENT: production
      SIDECAR_ROOT: /data/sidecars
    volumes:
      - sidecar_data:/data/sidecars
    # Beat is a scheduler, not a worker — it never answers `celery inspect ping`
    # and serves no HTTP, so it would inherit the image's API healthcheck and be
    # perpetually (falsely) "unhealthy". Check liveness via the schedule file,
    # which beat rewrites as it ticks; a dead/hung beat stops updating it.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,glob,time; fs=glob.glob('/tmp/celerybeat-schedule*'); sys.exit(0 if fs and (time.time()-max(os.path.getmtime(f) for f in fs))<1800 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - internal

volumes:
  pgdata:
  upload_data:
  parquet_data:
  export_data:
  models_data:
  sidecar_data:
  caddy_data:
  caddy_config:

networks:
  internal:
